<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the City - Beranda</title>
    <!-- Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <!-- Tailwind for quick and beautiful UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        body {
            position: relative;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: auto;
            pointer-events: none;
            z-index: 0;
            border-radius: 9999px;
            filter: blur(18px);
            opacity: 0.55;
            animation: drift 14s ease-in-out infinite alternate;
        }
        body::before {
            width: 22rem;
            height: 22rem;
            top: -5rem;
            right: -6rem;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.34) 0%, rgba(251, 191, 36, 0.08) 55%, rgba(251, 191, 36, 0) 75%);
        }
        body::after {
            width: 18rem;
            height: 18rem;
            bottom: -5rem;
            left: -4rem;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.3) 0%, rgba(96, 165, 250, 0.08) 55%, rgba(96, 165, 250, 0) 75%);
            animation-delay: -6s;
        }
        .dashboard-shell {
            position: relative;
            z-index: 1;
            animation: panelIn 700ms ease-out both;
        }
        .avatar-option {
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 2.5rem;
            padding: 10px;
            border-radius: 50%;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3.25rem;
            height: 3.25rem;
            line-height: 1;
        }
        .avatar-option.selected {
            border-color: #fbbf24;
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        #display-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            flex-shrink: 0;
            line-height: 1;
            font-size: 1.9rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.1);
        }
        @media (max-width: 767px) {
            #avatar-container {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 0.25rem;
                justify-items: center;
                align-items: center;
            }
            .avatar-option {
                font-size: 2rem;
                padding: 0.4rem;
            }
            .avatar-option.selected {
                transform: scale(1.04);
            }
            #display-avatar {
                width: 2.75rem;
                height: 2.75rem;
                font-size: 1.75rem;
            }
            .edit-profile-btn {
                padding: 0.4rem 0.7rem;
                font-size: 0.68rem;
            }
        }
        .btn-primary {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #333;
            font-weight: bold;
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(253, 160, 133, 0.5);
            filter: brightness(1.02);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }
        .edit-profile-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.45rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #111827;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.98), rgba(253, 160, 133, 0.96));
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 8px 18px rgba(253, 160, 133, 0.22);
            transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
        }
        .edit-profile-btn:hover {
            transform: translateY(-1px) scale(1.03);
            box-shadow: 0 12px 24px rgba(253, 160, 133, 0.3);
            filter: brightness(1.03);
        }
        .edit-profile-btn:active {
            transform: translateY(0) scale(0.99);
        }
        /* Hide sections initially */
        .hidden-section { display: none; }
        #step-profile,
        #step-menu,
        #step-create,
        #step-join,
        #step-list {
            animation: sectionPop 280ms ease-out;
        }
        #avatar-container .avatar-option {
            animation: avatarPop 420ms ease-out both;
        }
        #avatar-container .avatar-option:nth-child(1) { animation-delay: 20ms; }
        #avatar-container .avatar-option:nth-child(2) { animation-delay: 60ms; }
        #avatar-container .avatar-option:nth-child(3) { animation-delay: 100ms; }
        #avatar-container .avatar-option:nth-child(4) { animation-delay: 140ms; }
        #avatar-container .avatar-option:nth-child(5) { animation-delay: 180ms; }
        h1 {
            animation: titleGlow 4s ease-in-out infinite;
        }
        @keyframes drift {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(0, 18px, 0) scale(1.08); }
        }
        @keyframes panelIn {
            from { opacity: 0; transform: translateY(18px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes sectionPop {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes avatarPop {
            from { opacity: 0; transform: translateY(8px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 0 rgba(251, 191, 36, 0)); }
            50% { filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.18)); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

<div class="glass-panel dashboard-shell p-8 w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500 drop-shadow-md">TeKo!!</h1>
        <p class="text-sm mt-2 text-gray-200">Game Edukasi Kota Indonesia</p>
    </div>

    <!-- Step 1: Profile Setup -->
    <div id="step-profile">
        <h2 class="text-xl font-bold mb-4">Siapkan Profilmu</h2>
        <div class="mb-4">
            <label class="block text-sm mb-2">Nickname:</label>
            <input type="text" id="nickname" class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Masukkan nama...">
        </div>
        <div class="mb-6">
            <label class="block text-sm mb-2">Pilih Avatar:</label>
            <div class="flex justify-between" id="avatar-container">
                <div class="avatar-option selected" data-avatar="🦊">🦊</div>
                <div class="avatar-option" data-avatar="🐼">🐼</div>
                <div class="avatar-option" data-avatar="🐯">🐯</div>
                <div class="avatar-option" data-avatar="🐸">🐸</div>
                <div class="avatar-option" data-avatar="🐱">🐱</div>
            </div>
        </div>
        <button id="btn-next" class="btn-primary w-full py-3 rounded-lg text-lg">Lanjut</button>
    </div>

    <!-- Step 2: Main Menu -->
    <div id="step-menu" class="hidden-section">
        <div class="flex items-center mb-6 bg-white/10 p-3 rounded-lg">
            <div id="display-avatar" class="text-3xl mr-3">🦊</div>
            <div id="display-nickname" class="font-bold text-lg">Player</div>
            <button id="btn-edit-profile" class="ml-auto edit-profile-btn">✎ Ubah</button>
        </div>
        <div class="space-y-4">
            <button id="btn-show-create" class="btn-primary w-full py-3 rounded-lg text-lg">Buat Room (Host)</button>
            <button id="btn-show-join" class="btn-secondary w-full py-3 rounded-lg text-lg">Masukkan Kode Room</button>
            <button id="btn-show-list" class="btn-secondary w-full py-3 rounded-lg text-lg">Room Yang Tersedia</button>
        </div>
    </div>

    <!-- Step 3: Create Room -->
    <div id="step-create" class="hidden-section">
        <h2 class="text-xl font-bold mb-4">Buat Room Baru</h2>
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm mb-1">Maksimal Player (2-10):</label>
                <input type="number" id="max-players" min="2" max="10" value="10" class="w-full px-4 py-2 rounded bg-white/20 border border-white/30 text-white focus:outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1">Poin untuk Menang (50-150):</label>
                <input type="number" id="win-points" min="50" max="150" step="10" value="100" class="w-full px-4 py-2 rounded bg-white/20 border border-white/30 text-white focus:outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1">Tingkat Kesulitan:</label>
                <select id="room-difficulty" class="w-full px-4 py-2 rounded bg-white/20 border border-white/30 text-white focus:outline-none">
                    <option class="text-black" value="Easy">Gampang (Easy)</option>
                    <option class="text-black" value="Medium">Sedang (Medium)</option>
                    <option class="text-black" value="Hard">Susah (Hard)</option>
                </select>
            </div>
            <div class="flex items-center mt-2">
                <input type="checkbox" id="room-private" class="w-5 h-5 mr-3 accent-yellow-400">
                <label for="room-private" class="text-sm">Buat Room Privat (Tidak muncul di Lobby)</label>
            </div>
        </div>
        <div class="flex space-x-3">
            <button id="btn-back-from-create" class="btn-secondary flex-1 py-3 rounded-lg">Kembali</button>
            <button id="btn-create-room" class="btn-primary flex-1 py-3 rounded-lg">Buat!</button>
        </div>
    </div>

    <!-- Step 4: Join via Code -->
    <div id="step-join" class="hidden-section">
        <h2 class="text-xl font-bold mb-4">Gabung dengan Kode</h2>
        <input type="text" id="room-code-input" class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white text-center text-2xl uppercase tracking-widest mb-6 focus:outline-none" placeholder="KODE5">
        <div class="flex space-x-3">
            <button id="btn-back-from-join" class="btn-secondary flex-1 py-3 rounded-lg">Kembali</button>
            <button id="btn-join-room" class="btn-primary flex-1 py-3 rounded-lg">Gabung!</button>
        </div>
    </div>

    <!-- Step 5: Lobby List -->
    <div id="step-list" class="hidden-section">
        <h2 class="text-xl font-bold mb-4">Room Yang Tersedia</h2>
        <div id="lobby-list" class="space-y-3 mb-6 max-h-60 overflow-y-auto pr-2">
            <!-- Lobbies will be injected here -->
        </div>
        <button id="btn-back-from-list" class="btn-secondary w-full py-3 rounded-lg">Kembali</button>
    </div>

</div>

<script>
    const BACKEND_URL = 'https://projek-pemweb-production-345a.up.railway.app';
    const STORAGE_KEY = 'tebak_kota_user';
    let SERVER_BOOT_ID = '';
    // State
    let currentUser = {
        nickname: '',
        avatar: '🦊',
        isHost: false,
        userId: '',
        serverBootId: ''
    };

    const normalizeAvatar = (value) => {
        const legacyAvatarMap = {
            'ðŸ¦Š': '🦊',
            'ðŸ¼': '🐼',
            'ðŸ¯': '🐯',
            'ðŸ¸': '🐸',
            'ðŸ±': '🐱'
        };
        return legacyAvatarMap[value] || value || '🦊';
    };

    const ensureUserId = () => {
        if (!currentUser.userId) {
            currentUser.userId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `user_${Math.random().toString(36).slice(2, 10)}`;
        }
        return currentUser.userId;
    };

    const fetchServerBootId = async () => {
        try {
            const res = await fetch(`${BACKEND_URL}/api/meta`);
            const data = await res.json();
            SERVER_BOOT_ID = String(data.server_boot_id || '');
        } catch (error) {
            SERVER_BOOT_ID = '';
        }
    };

    const loadSavedUser = () => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return null;

        try {
            const data = JSON.parse(saved);
            if (!data || data.serverBootId !== SERVER_BOOT_ID) {
                localStorage.removeItem(STORAGE_KEY);
                return null;
            }
            return data;
        } catch (error) {
            localStorage.removeItem(STORAGE_KEY);
            return null;
        }
    };

    // DOM Elements
    const stepProfile = document.getElementById('step-profile');
    const stepMenu = document.getElementById('step-menu');
    const stepCreate = document.getElementById('step-create');
    const stepJoin = document.getElementById('step-join');
    const stepList = document.getElementById('step-list');
    let lobbyRefreshInterval = null;

    const startLobbyAutoRefresh = () => {
        if (lobbyRefreshInterval) return;
        lobbyRefreshInterval = setInterval(() => {
            if (!stepList.classList.contains('hidden-section')) {
                fetchLobbies();
            }
        }, 4000);
    };

    const stopLobbyAutoRefresh = () => {
        if (!lobbyRefreshInterval) return;
        clearInterval(lobbyRefreshInterval);
        lobbyRefreshInterval = null;
    };

    // Avatar selection
    document.querySelectorAll('.avatar-option').forEach(el => {
        el.addEventListener('click', () => {
        document.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
            currentUser.avatar = normalizeAvatar(el.getAttribute('data-avatar'));
        });
    });

    // Navigation
    function showSection(section) {
        [stepProfile, stepMenu, stepCreate, stepJoin, stepList].forEach(el => el.classList.add('hidden-section'));
        section.classList.remove('hidden-section');
        section.style.animation = 'none';
        section.offsetHeight;
        section.style.animation = '';

        if (section === stepList) {
            startLobbyAutoRefresh();
        } else {
            stopLobbyAutoRefresh();
        }
    }

    document.getElementById('btn-next').addEventListener('click', () => {
        const nick = document.getElementById('nickname').value.trim();
        if(!nick) {
            alert('Silakan masukkan nickname!');
            return;
        }
        currentUser.nickname = nick;
        currentUser.serverBootId = SERVER_BOOT_ID;
        ensureUserId();
        document.getElementById('display-nickname').textContent = nick;
        document.getElementById('display-avatar').textContent = normalizeAvatar(currentUser.avatar);
        
        // Save to localStorage for convenience
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
        
        showSection(stepMenu);
    });

    document.getElementById('btn-edit-profile').addEventListener('click', () => {
        showSection(stepProfile);
    });

    // Check if returning user
    window.onload = async () => {
        await fetchServerBootId();
        const data = loadSavedUser();
        if (data) {
            document.getElementById('nickname').value = data.nickname;
            // auto select avatar
            document.querySelectorAll('.avatar-option').forEach(opt => {
                if(normalizeAvatar(opt.getAttribute('data-avatar')) === normalizeAvatar(data.avatar)) {
                    opt.click();
                }
            });
            currentUser.nickname = data.nickname;
            currentUser.avatar = normalizeAvatar(data.avatar);
            currentUser.userId = data.userId || '';
            currentUser.serverBootId = SERVER_BOOT_ID;
            ensureUserId();
            document.getElementById('display-nickname').textContent = data.nickname;
            document.getElementById('display-avatar').textContent = normalizeAvatar(data.avatar);
            showSection(stepMenu);
        }
    };

    // Menu Buttons
    document.getElementById('btn-show-create').addEventListener('click', () => showSection(stepCreate));
    document.getElementById('btn-show-join').addEventListener('click', () => showSection(stepJoin));
    document.getElementById('btn-show-list').addEventListener('click', () => {
        fetchLobbies();
        showSection(stepList);
    });

    // Back Buttons
    document.getElementById('btn-back-from-create').addEventListener('click', () => showSection(stepMenu));
    document.getElementById('btn-back-from-join').addEventListener('click', () => showSection(stepMenu));
    document.getElementById('btn-back-from-list').addEventListener('click', () => showSection(stepMenu));

    // Actions
    document.getElementById('btn-create-room').addEventListener('click', async () => {
        const maxPlayers = document.getElementById('max-players').value;
        const winPoints = document.getElementById('win-points').value;
        const difficulty = document.getElementById('room-difficulty').value;
        const isPrivate = document.getElementById('room-private').checked;
        try {
            const res = await fetch(`${BACKEND_URL}/api/rooms`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nickname: currentUser.nickname,
                    max_players: maxPlayers,
                    win_points: winPoints,
                    difficulty: difficulty,
                    is_private: isPrivate
                })
            });
            const data = await res.json();
            if(data.success) {
                currentUser.isHost = true;
                currentUser.serverBootId = SERVER_BOOT_ID;
                ensureUserId();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
                window.location.href = `/room/${data.room_code}`;
            }
        } catch (e) {
            alert('Gagal membuat room!');
        }
    });

    document.getElementById('btn-join-room').addEventListener('click', () => {
        const code = document.getElementById('room-code-input').value.trim().toUpperCase();
        if(!code) return alert('Masukkan kode room!');
        currentUser.isHost = false;
        currentUser.serverBootId = SERVER_BOOT_ID;
        ensureUserId();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
        window.location.href = `/room/${code}?source=code`;
    });

    async function fetchLobbies() {
        const listDiv = document.getElementById('lobby-list');
        listDiv.innerHTML = '<p class="text-center text-sm">Memuat...</p>';
        try {
            const res = await fetch(`${BACKEND_URL}/api/rooms`);
            const rooms = await res.json();
            if(rooms.length === 0) {
                listDiv.innerHTML = '<p class="text-center text-sm opacity-70">Belum ada room yang tersedia.</p>';
                return;
            }
            listDiv.innerHTML = rooms.map(r => `
                <div class="bg-white/10 p-3 rounded-lg flex justify-between items-center hover:bg-white/20 transition cursor-pointer mb-2" onclick="joinLobby('${r.code}')">
                    <div>
                        <div class="font-bold text-sm">Room: ${r.host_name}</div>
                        <div class="text-xs opacity-80">${r.players_count}/${r.max_players} Players | Win: ${r.win_points} Pts | ${r.difficulty}</div>
                    </div>
                    <div class="font-mono bg-white/20 px-2 py-1 rounded text-sm">${r.code}</div>
                </div>
            `).join('');
        } catch(e) {
            listDiv.innerHTML = '<p class="text-center text-sm text-red-300">Gagal memuat list.</p>';
        }
    }

    // Global function to be called from inline HTML
    window.joinLobby = function(code) {
        currentUser.isHost = false;
        currentUser.serverBootId = SERVER_BOOT_ID;
        ensureUserId();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser));
        window.location.href = `/room/${code}?source=lobby`;
    };

    window.addEventListener('beforeunload', stopLobbyAutoRefresh);

</script>
</body>
</html>
